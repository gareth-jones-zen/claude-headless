[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-headless"
version = "0.1.0"
description = "Run Claude Code headless from background tools, and survive the usage limit: one queue per seat."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "win-background>=0.2",   # the queue task, the runner lock and the log; not on PyPI, see README
]

[project.scripts]
claude-headless = "claude_headless.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
